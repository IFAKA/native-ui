<!doctype html>
<html lang="en">
<body>
  <main class="nui-container nui-readable">
    <h1 data-case="long-label">Interaction laboratory for keyboard, focus, and reduced-motion checks</h1>
    <details><summary>Native disclosure</summary><p>Content remains available without JavaScript.</p></details>
    <section data-case="empty"><h2>Empty state</h2><p>There are no experiments.</p></section>
    <section data-case="loading" aria-busy="true"><h2>Loading experiment</h2></section>
    <section data-case="error" role="alert"><h2>Experiment unavailable</h2></section>
    <section data-case="dense" class="nui-stack"><label>Choose a mode <select id="mode" name="mode"><option>Keyboard</option><option>Pointer</option></select></label><button type="button" data-variant="danger">Clear results</button><output aria-live="polite">Ready</output></section>
  </main>
</body>
</html>
