<!doctype html>
<html lang="en">
<body>
  <main class="nui-container nui-readable">
    <article>
      <header data-case="long-label"><p>Native UI · 10 August 2026</p><h1>An intentionally long article title that can grow with localization</h1></header>
      <p>Semantic content remains readable when media is missing and words are long.</p>
      <figure data-case="empty"><figcaption>No media supplied; the caption remains useful.</figcaption></figure>
      <section data-case="loading" aria-busy="true"><h2>Loading related notes</h2></section>
      <section data-case="error" role="alert"><h2>Related notes unavailable</h2><p>Try again later.</p></section>
      <section data-case="dense"><h2>Details</h2><ul><li>First item</li><li>Second item</li><li>Third item</li></ul></section>
      <footer><button type="button" data-variant="quiet">Save article</button></footer>
    </article>
  </main>
</body>
</html>
