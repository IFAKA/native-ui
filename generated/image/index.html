<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>image</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./image.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>image</h1></header>
<section><h2>Example 1</h2><figure class="image">
  <img src="../assets/placeholder.svg" alt="Description" />
</figure>
</section>
<section><h2>Example 2</h2><figure class="image">
  <img src="../assets/placeholder.svg" alt="Description" />
  <figcaption class="image-caption">Photo caption text</figcaption>
</figure>
</section>
<section><h2>Example 3</h2><figure class="image">
  <img src="../assets/placeholder.svg" alt="Description" />
  <div class="image-fallback">
    <svg><circle cx="12" cy="12" r="8"/></svg>
  </div>
</figure>
</section>
<section><h2>Example 4</h2><figure class="image" data-preview>
  <img src="../assets/placeholder.svg" alt="Description" />
</figure>
</section>
<section><h2>Example 5</h2><figure class="image" data-ratio="16/9">
  <img src="../assets/placeholder.svg" alt="Description" />
</figure>
</section>
<section><h2>Example 6</h2><!-- Basic image -->
<figure class="image">
  <img src="../assets/placeholder.svg" alt="Description" />
</figure>

<!-- Image with caption -->
<figure class="image">
  <img src="../assets/placeholder.svg" alt="Description" />
  <figcaption class="image-caption">Photo caption text</figcaption>
</figure>

<!-- Image with aspect ratio -->
<figure class="image" data-ratio="16/9">
  <img src="../assets/placeholder.svg" alt="Description" />
</figure>
</section>
  </main>
</body>
</html>
