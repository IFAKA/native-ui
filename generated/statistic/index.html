<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>statistic</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./statistic.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>statistic</h1></header>
<section><h2>Example 1</h2><!-- Basic statistic -->
<div class="statistic">
  <p class="statistic-title">Total Revenue</p>
  <p class="statistic-value">$45,231.89</p>
  <p class="statistic-description">+20.1% from last month</p>
</div>

<!-- Statistic with trend -->
<div class="statistic">
  <p class="statistic-title">Subscriptions</p>
  <p class="statistic-value">+2,350</p>
  <p class="statistic-description">
    <span class="statistic-trend" data-trend="up">
      <svg><circle cx="12" cy="12" r="8"/></svg>
      +12.5%
    </span>
    from last month
  </p>
</div>
</section>
  </main>
</body>
</html>
