<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>input</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./input.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>input</h1></header>
<section><h2>Example 1</h2><label class="label" for="input-example-1-email">Email</label>
<input class="input" type="email" id="input-example-1-email" placeholder="you@example.com">
</section>
<section><h2>Example 2</h2><div>
  <label class="label" for="input-example-2-username">Username</label>
  <input class="input" type="text" id="input-example-2-username" placeholder="codylindley">
  <p class="field-description">Choose a unique username for your account.</p>
</div>
</section>
<section><h2>Example 3</h2><label class="label" for="input-example-3-name">
  Name <span aria-hidden="true" class="text-destructive">*</span>
</label>
<input class="input" type="text" id="input-example-3-name" required placeholder="Jane Doe">
</section>
<section><h2>Example 4</h2><label class="label" for="input-example-4-bad-email">Email</label>
<input class="input" type="email" id="input-example-4-bad-email" aria-invalid="true" value="not-an-email">
<p class="field-error">Please enter a valid email address.</p>
</section>
<section><h2>Example 5</h2><div>
  <svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  <input class="input" type="search" placeholder="Search...">
</div>
</section>
<section><h2>Example 6</h2><label class="label" for="input-example-6-avatar">Picture</label>
<input class="input" type="file" id="input-example-6-avatar">
</section>
<section><h2>Example 7</h2><label class="label" for="input-example-7-password">Password</label>
<input class="input" type="password" id="input-example-7-password" placeholder="Enter your password">
</section>
<section><h2>Example 8</h2><label class="label" for="input-example-8-api-key">API Key</label>
<input class="input" type="text" id="input-example-8-api-key" readonly value="sk-1234567890abcdef">
</section>
<section><h2>Example 9</h2><div>
  <input class="input" type="search" placeholder="Search...">
  <button class="btn" data-variant="default">Search</button>
</div>
</section>
<section><h2>Example 10</h2><label class="label" for="input-example-10-message">Message</label>
<textarea class="input" id="input-example-10-message" placeholder="Your message..."></textarea>
</section>
  </main>
</body>
</html>
