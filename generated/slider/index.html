<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slider</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./slider.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>slider</h1></header>
<section><h2>Example 1</h2><input class="slider" type="range" min="0" max="100" value="50">
</section>
<section><h2>Example 2</h2><label class="label" for="slider-example-2-volume">Volume</label>
<input class="slider" type="range" id="slider-example-2-volume" min="0" max="100" value="50">
</section>
<section><h2>Example 3</h2><div>
  <label class="label" for="slider-example-3-temp">Temperature</label>
  <output class="text-sm text-muted-foreground" for="slider-example-3-temp">0.5</output>
</div>
<input class="slider" type="range" id="slider-example-3-temp" min="0" max="1" step="0.1" value="0.5">
</section>
<section><h2>Example 4</h2><input class="slider" type="range" min="0" max="100" step="25" value="50">
</section>
<section><h2>Example 5</h2><input class="slider" type="range" data-orientation="vertical" min="0" max="100" value="50">
</section>
<section><h2>Example 6</h2><input class="slider" type="range" min="0" max="100" value="50" disabled>
</section>
  </main>
</body>
</html>
