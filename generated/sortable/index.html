<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sortable</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./sortable.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>sortable</h1></header>
<section><h2>Example 1</h2><ul class="sortable" role="listbox" aria-label="Reorder items">
  <li class="sortable-item" draggable="true" role="option" tabindex="0">
    <span class="sortable-handle"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></span>
    <span>Item 1</span>
  </li>
  <li class="sortable-item" draggable="true" role="option" tabindex="-1">
    <span class="sortable-handle"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></span>
    <span>Item 2</span>
  </li>
  <li class="sortable-item" draggable="true" role="option" tabindex="-1">
    <span class="sortable-handle"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></span>
    <span>Item 3</span>
  </li>
</ul>
</section>
<section><h2>Example 2</h2><ul class="sortable" role="listbox" aria-label="Reorder items" data-orientation="horizontal">
  <li class="sortable-item" draggable="true" role="option" tabindex="0">
    <span>Item A</span>
  </li>
  <li class="sortable-item" draggable="true" role="option" tabindex="-1">
    <span>Item B</span>
  </li>
</ul>
</section>
<section><h2>Example 3</h2><ul class="sortable" role="listbox" aria-label="Sortable items"><li class="sortable-item" aria-disabled="true" tabindex="-1">
  <span class="sortable-handle"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></span>
  <span>Locked item</span>
</li>
</ul></section>
  </main>
  <script type="module" src="./sortable.js"></script>
</body>
</html>
