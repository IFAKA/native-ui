<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carousel</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./carousel.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>carousel</h1></header>
<section><h2>Example 1</h2><div class="carousel" role="region" aria-roledescription="carousel" aria-label="Featured slides">
  <div class="carousel-viewport" aria-live="polite">
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 5">
      <!-- slide content -->
    </div>
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="2 of 5">
      <!-- slide content -->
    </div>
    <!-- more slides -->
  </div>
  <button class="carousel-prev" aria-label="Previous slide">
    <svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
  </button>
  <button class="carousel-next" aria-label="Next slide">
    <svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
  </button>
</div>
</section>
<section><h2>Example 2</h2><div class="carousel" role="region" aria-roledescription="carousel" aria-label="Gallery">
  <div class="carousel-viewport" aria-live="polite">
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 3">…</div>
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="2 of 3">…</div>
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="3 of 3">…</div>
  </div>
  <button class="carousel-prev" aria-label="Previous slide"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="carousel-next" aria-label="Next slide"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  <div class="carousel-dots" role="group" aria-label="Choose slide to display">
    <!-- dots are auto-generated by JS if this container is empty -->
  </div>
</div>
</section>
<section><h2>Example 3</h2><div class="carousel" role="region" aria-roledescription="carousel" aria-label="Slides">
  <div class="carousel-viewport" aria-live="polite">…</div>
  <button class="carousel-prev" aria-label="Previous slide"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="carousel-next" aria-label="Next slide"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  <div class="carousel-counter" aria-live="polite">Slide 1 of 5</div>
</div>
</section>
<section><h2>Example 4</h2><div class="carousel" data-orientation="vertical" role="region" aria-roledescription="carousel" aria-label="Vertical slides">
  <div class="carousel-viewport" aria-live="polite">
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 3">…</div>
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="2 of 3">…</div>
    <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="3 of 3">…</div>
  </div>
  <button class="carousel-prev" aria-label="Previous slide"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="carousel-next" aria-label="Next slide"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
</div>
</section>
<section><h2>Example 5</h2><div class="carousel" data-loop role="region" aria-roledescription="carousel" aria-label="Looping slides">
  …
</div>
</section>
<section><h2>Example 6</h2><div class="carousel" data-autoplay="3000" data-loop role="region" aria-roledescription="carousel" aria-label="Auto-rotating slides">
  …
</div>
</section>
<section><h2>Example 7</h2><!-- 3 slides visible -->
<div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 9">…</div>

<!-- 2 slides visible -->
<div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 6">…</div>
</section>
  </main>
  <script type="module" src="./carousel.js"></script>
</body>
</html>
