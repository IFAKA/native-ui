<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>button-group</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./button-group.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>button-group</h1></header>
<section><h2>Example 1</h2><div class="btn-group" role="group" aria-label="Actions">
  <button class="btn" data-variant="outline">Save</button>
  <button class="btn" data-variant="outline">Edit</button>
  <button class="btn" data-variant="outline">Delete</button>
</div>
</section>
<section><h2>Example 2</h2><div class="btn-group" data-orientation="vertical" role="group" aria-label="Actions">
  <button class="btn" data-variant="outline">Top</button>
  <button class="btn" data-variant="outline">Middle</button>
  <button class="btn" data-variant="outline">Bottom</button>
</div>
</section>
<section><h2>Example 3</h2><div class="btn-group" role="group" aria-label="Actions">
  <button class="btn" data-variant="default">Copy</button>
  <hr role="separator">
  <button class="btn" data-variant="default">Paste</button>
</div>
</section>
  </main>
</body>
</html>
