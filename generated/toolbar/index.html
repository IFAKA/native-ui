<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolbar</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./toolbar.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>toolbar</h1></header>
<section><h2>Example 1</h2><div class="toolbar" role="toolbar" aria-label="Formatting" aria-orientation="horizontal">
  <div class="toggle-group" role="group" aria-label="Text style" data-type="multiple">
    <button class="toggle" aria-pressed="false">
      <svg aria-hidden="true" ...><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="toggle" aria-pressed="false">
      <svg aria-hidden="true" ...><circle cx="12" cy="12" r="8"/></svg>
    </button>
  </div>
  <div class="separator" data-orientation="vertical" role="separator"></div>
  <div class="toggle-group" role="group" aria-label="Alignment" data-type="single">
    <button class="toggle" aria-pressed="true">
      <svg aria-hidden="true" ...><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="toggle" aria-pressed="false">
      <svg aria-hidden="true" ...><circle cx="12" cy="12" r="8"/></svg>
    </button>
  </div>
  <div class="separator" data-orientation="vertical" role="separator"></div>
  <a class="btn" data-variant="link" href="#" target="_blank">Link</a>
</div>
</section>
  </main>
  <script type="module" src="./toolbar.js"></script>
</body>
</html>
