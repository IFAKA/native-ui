<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>collapsible</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./collapsible.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>collapsible</h1></header>
<section><h2>Example 1</h2><details class="collapsible">
  <summary class="collapsible-trigger">
    <span>Click to expand</span>
    <svg class="collapsible-chevron"><circle cx="12" cy="12" r="8"/></svg>
  </summary>
  <div class="collapsible-content">
    <p>Collapsible content goes here.</p>
  </div>
</details>
</section>
  </main>
</body>
</html>
