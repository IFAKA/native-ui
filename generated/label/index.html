<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>label</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./label.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>label</h1></header>
<section><h2>Example 1</h2><label class="label" for="label-example-1-email">Email</label>
<input class="input" id="label-example-1-email" type="email">
</section>
<section><h2>Example 2</h2><label class="label" for="label-example-2-name">
  Name <span aria-hidden="true" class="text-destructive">*</span>
</label>
<input class="input" id="label-example-2-name" type="text" required>
</section>
<section><h2>Example 3</h2><label class="label" for="label-example-3-bio">
  Bio <span class="label-hint">(optional)</span>
</label>
<textarea class="input" id="label-example-3-bio"></textarea>
</section>
<section><h2>Example 4</h2><label class="label" data-disabled for="label-example-4-disabled-field">Disabled field</label>
<input class="input" id="label-example-4-disabled-field" disabled>
</section>
<section><h2>Example 5</h2><label class="label" for="label-example-5-auto-disabled">Auto-disabled</label>
<input class="input" id="label-example-5-auto-disabled" disabled>
</section>
<section><h2>Example 6</h2><div class="flex items-center gap-2">
  <input class="checkbox" type="checkbox" id="label-example-6-terms">
  <label class="label" for="label-example-6-terms">Accept terms and conditions</label>
</div>
</section>
<section><h2>Example 7</h2><div class="flex items-center gap-2">
  <input class="switch" type="checkbox" role="switch" id="label-example-7-airplane">
  <label class="label" for="label-example-7-airplane">Airplane Mode</label>
</div>
</section>
<section><h2>Example 8</h2><div>
  <label class="label" for="label-example-8-username">Username</label>
  <input class="input" id="label-example-8-username" type="text" placeholder="shadcn">
  <p class="field-description">This is your public display name.</p>
</div>
</section>
  </main>
</body>
</html>
