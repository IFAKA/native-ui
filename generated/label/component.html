<label class="label" for="label-example-1-email">Email</label>
<input class="input" id="label-example-1-email" type="email">

<label class="label" for="label-example-2-name">
  Name <span aria-hidden="true" class="text-destructive">*</span>
</label>
<input class="input" id="label-example-2-name" type="text" required>

<label class="label" for="label-example-3-bio">
  Bio <span class="label-hint">(optional)</span>
</label>
<textarea class="input" id="label-example-3-bio"></textarea>

<label class="label" data-disabled for="label-example-4-disabled-field">Disabled field</label>
<input class="input" id="label-example-4-disabled-field" disabled>

<label class="label" for="label-example-5-auto-disabled">Auto-disabled</label>
<input class="input" id="label-example-5-auto-disabled" disabled>

<div class="flex items-center gap-2">
  <input class="checkbox" type="checkbox" id="label-example-6-terms">
  <label class="label" for="label-example-6-terms">Accept terms and conditions</label>
</div>

<div class="flex items-center gap-2">
  <input class="switch" type="checkbox" role="switch" id="label-example-7-airplane">
  <label class="label" for="label-example-7-airplane">Airplane Mode</label>
</div>

<div>
  <label class="label" for="label-example-8-username">Username</label>
  <input class="input" id="label-example-8-username" type="text" placeholder="shadcn">
  <p class="field-description">This is your public display name.</p>
</div>
