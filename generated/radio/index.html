<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>radio</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./radio.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>radio</h1></header>
<section><h2>Example 1</h2><fieldset class="radio-group">
  <legend class="label">Choose a plan</legend>
  <div class="radio-item">
    <input class="radio" type="radio" name="plan" id="radio-example-1-free" value="free" checked>
    <label for="radio-example-1-free">Free</label>
  </div>
  <div class="radio-item">
    <input class="radio" type="radio" name="plan" id="radio-example-1-pro" value="pro">
    <label for="radio-example-1-pro">Pro</label>
  </div>
  <div class="radio-item">
    <input class="radio" type="radio" name="plan" id="radio-example-1-enterprise" value="enterprise">
    <label for="radio-example-1-enterprise">Enterprise</label>
  </div>
</fieldset>
</section>
<section><h2>Example 2</h2><fieldset class="radio-group">
  <legend class="label">Spacing</legend>
  <div class="radio-item-block">
    <input class="radio" type="radio" name="spacing" id="radio-example-2-default" value="default" checked>
    <label for="radio-example-2-default">Default</label>
    <span class="radio-description">Standard spacing for most use cases.</span>
  </div>
  <div class="radio-item-block">
    <input class="radio" type="radio" name="spacing" id="radio-example-2-comfortable" value="comfortable">
    <label for="radio-example-2-comfortable">Comfortable</label>
    <span class="radio-description">More space between elements.</span>
  </div>
</fieldset>
</section>
<section><h2>Example 3</h2><fieldset class="radio-group">
  <legend class="label">Select a plan</legend>
  <label class="radio-card" for="radio-example-3-c-plus">
    <input class="radio" type="radio" name="card-plan" id="radio-example-3-c-plus" value="plus">
    <label for="radio-example-3-c-plus">Plus</label>
    <span class="radio-description">For individuals and small teams.</span>
  </label>
  <label class="radio-card" for="radio-example-3-c-pro">
    <input class="radio" type="radio" name="card-plan" id="radio-example-3-c-pro" value="pro" checked>
    <label for="radio-example-3-c-pro">Pro</label>
    <span class="radio-description">For growing businesses.</span>
  </label>
</fieldset>
</section>
<section><h2>Example 4</h2><fieldset class="radio-group" data-orientation="horizontal">
  <legend class="label">Alignment</legend>
  <div class="radio-item">
    <input class="radio" type="radio" name="align" id="radio-example-4-left" value="left" checked>
    <label for="radio-example-4-left">Left</label>
  </div>
  <div class="radio-item">
    <input class="radio" type="radio" name="align" id="radio-example-4-center" value="center">
    <label for="radio-example-4-center">Center</label>
  </div>
  <div class="radio-item">
    <input class="radio" type="radio" name="align" id="radio-example-4-right" value="right">
    <label for="radio-example-4-right">Right</label>
  </div>
</fieldset>
</section>
  </main>
</body>
</html>
