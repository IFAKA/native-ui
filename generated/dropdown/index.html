<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dropdown</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./dropdown.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>dropdown</h1></header>
<section><h2>Example 1</h2><!-- Trigger -->
<button class="btn" data-variant="outline"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="dropdown-example-1-my-menu"
        data-dropdown-trigger="dropdown-example-1-my-menu" popovertarget="dropdown-example-1-my-menu">
  Options
  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2">
    <path d="m6 9 6 6 6-6"/>
  </svg>
</button>

<!-- Menu -->
<div id="dropdown-example-1-my-menu" role="menu" popover
     class="dropdown-content"
     aria-label="Options menu">

  <div role="group" aria-label="Navigation">
    <button role="menuitem" class="dropdown-item" tabindex="-1">
      Profile
    </button>
    <button role="menuitem" class="dropdown-item" tabindex="-1">
      Settings
    </button>
  </div>

  <div class="dropdown-separator" role="separator"></div>

  <div role="group" aria-label="Actions">
    <button role="menuitem" class="dropdown-item" tabindex="-1">
      <svg aria-hidden="true" width="16" height="16"><circle cx="12" cy="12" r="8"/></svg>
      Export
      <span class="dropdown-shortcut">⌘E</span>
    </button>
    <button role="menuitem" class="dropdown-item" data-variant="destructive" tabindex="-1">
      Delete
    </button>
  </div>
</div>
</section>
<section><h2>Example 2</h2><!-- Checkbox item -->
<button role="menuitemcheckbox" class="dropdown-item"
        aria-checked="true" tabindex="-1">
  <svg class="dropdown-check" aria-hidden="true" width="16" height="16">
    <path d="M20 6 9 17l-5-5"/>
  </svg>
  Show Sidebar
</button>

<!-- Radio group -->
<div role="group" aria-label="Sort order">
  <div class="dropdown-label">Sort by</div>
  <button role="menuitemradio" class="dropdown-item"
          aria-checked="true" tabindex="-1">
    <svg class="dropdown-check" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
    Date
  </button>
  <button role="menuitemradio" class="dropdown-item"
          aria-checked="false" tabindex="-1">
    Name
  </button>
</div>
</section>
  </main>
  <script type="module" src="./dropdown.js"></script>
</body>
</html>
