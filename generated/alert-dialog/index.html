<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alert-dialog</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./alert-dialog.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>alert-dialog</h1></header>
<section><h2>Example 1</h2><button class="btn" data-variant="outline" data-alert-dialog-trigger="alert-dialog-example-1-my-alert-dialog">
  Delete Account
</button>

<dialog id="alert-dialog-example-1-my-alert-dialog" class="alert-dialog" role="alertdialog" aria-modal="true"
        aria-labelledby="alert-dialog-example-1-ad-title" aria-describedby="alert-dialog-example-1-ad-desc">
  <div class="alert-dialog-content">
    <div class="alert-dialog-header">
      <h2 class="alert-dialog-title" id="alert-dialog-example-1-ad-title">Are you absolutely sure?</h2>
      <p class="alert-dialog-description" id="alert-dialog-example-1-ad-desc">
        This action cannot be undone. This will permanently delete your account.
      </p>
    </div>
    <div class="alert-dialog-footer">
      <button class="btn" data-variant="outline" data-alert-dialog-close>Cancel</button>
      <button class="btn" data-variant="destructive" data-alert-dialog-close>Delete</button>
    </div>
  </div>
</dialog>
</section>
  </main>
  <script type="module" src="./alert-dialog.js"></script>
</body>
</html>
