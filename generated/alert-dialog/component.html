<button class="btn" data-variant="outline" data-alert-dialog-trigger="alert-dialog-example-1-my-alert-dialog">
  Delete Account
</button>

<dialog id="alert-dialog-example-1-my-alert-dialog" class="alert-dialog" role="alertdialog" aria-modal="true"
        aria-labelledby="alert-dialog-example-1-ad-title" aria-describedby="alert-dialog-example-1-ad-desc">
  <div class="alert-dialog-content">
    <div class="alert-dialog-header">
      <h2 class="alert-dialog-title" id="alert-dialog-example-1-ad-title">Are you absolutely sure?</h2>
      <p class="alert-dialog-description" id="alert-dialog-example-1-ad-desc">
        This action cannot be undone. This will permanently delete your account.
      </p>
    </div>
    <div class="alert-dialog-footer">
      <button class="btn" data-variant="outline" data-alert-dialog-close>Cancel</button>
      <button class="btn" data-variant="destructive" data-alert-dialog-close>Delete</button>
    </div>
  </div>
</dialog>
