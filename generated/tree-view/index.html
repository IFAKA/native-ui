<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tree-view</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./tree-view.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>tree-view</h1></header>
<section><h2>Example 1</h2><ul class="tree" role="tree" aria-label="File explorer">
  <li class="tree-item" role="treeitem">
    <details class="tree-branch" open>
      <summary class="tree-branch-trigger">
        <svg><circle cx="12" cy="12" r="8"/></svg>
        <svg><circle cx="12" cy="12" r="8"/></svg>
        <span>src</span>
      </summary>
      <ul class="tree-group" role="group">
        <li class="tree-item" role="treeitem">
          <span class="tree-leaf">
            <svg><circle cx="12" cy="12" r="8"/></svg>
            <span>index.ts</span>
          </span>
        </li>
      </ul>
    </details>
  </li>
  <li class="tree-item" role="treeitem">
    <span class="tree-leaf">
      <svg><circle cx="12" cy="12" r="8"/></svg>
      <span>package.json</span>
    </span>
  </li>
</ul>
</section>
  </main>
</body>
</html>
