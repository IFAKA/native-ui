<form class="form">
  <div class="form-field">
    <label class="label" for="form-example-1-f-name">Name</label>
    <input class="input" type="text" id="form-example-1-f-name" required>
    <p class="field-description">Your full name.</p>
  </div>
  <div class="form-field">
    <label class="label" for="form-example-1-f-email">Email</label>
    <input class="input" type="email" id="form-example-1-f-email" required>
  </div>
  <div class="form-actions">
    <button class="btn" type="submit" data-variant="default">Submit</button>
    <button class="btn" type="reset" data-variant="outline">Reset</button>
  </div>
</form>

<div class="form-field-inline">
  <input class="checkbox" type="checkbox" id="form-example-2-terms">
  <label for="form-example-2-terms">Accept terms</label>
</div>

<div class="form-field" data-orientation="horizontal">
  <label class="label" for="form-example-3-f-user">Username</label>
  <div>
    <input class="input" type="text" id="form-example-3-f-user">
    <p class="field-description">Your public display name.</p>
  </div>
</div>

<div class="form-field-row">
  <div>
    <label class="label" for="form-example-4-f-marketing">Marketing emails</label>
    <p class="field-description">Receive emails about new products and features.</p>
  </div>
  <input class="switch" type="checkbox" role="switch" id="form-example-4-f-marketing">
</div>

<fieldset class="form-fieldset">
  <legend>Notifications</legend>
  <p class="field-description">Choose what you want to be notified about.</p>
  <div class="form-group">
    <div class="form-field-inline">
      <input class="checkbox" type="checkbox" id="form-example-5-opt-1">
      <label for="form-example-5-opt-1">All new messages</label>
    </div>
    <div class="form-field-inline">
      <input class="checkbox" type="checkbox" id="form-example-5-opt-2">
      <label for="form-example-5-opt-2">Direct messages only</label>
    </div>
  </div>
</fieldset>

<div class="form-field" data-invalid>
  <label class="label" for="form-example-6-f-email">Email</label>
  <input class="input" type="email" id="form-example-6-f-email" aria-invalid="true" aria-describedby="form-example-6-f-email-err">
  <p class="field-error" id="form-example-6-f-email-err" role="alert">Please enter a valid email address.</p>
</div>
