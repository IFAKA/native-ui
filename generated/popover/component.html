<button class="btn" data-variant="outline" popovertarget="popover-example-1-my-popover">Open Popover</button>

<div class="popover" id="popover-example-1-my-popover" popover>
  <div class="popover-header">
    <p class="popover-title">Dimensions</p>
    <p class="popover-description">Set the dimensions for the layer.</p>
  </div>
  <div class="popover-content">
    <!-- any content -->
  </div>
</div>

<button class="btn" popovertarget="popover-example-2-pop-top">Top</button>
<div class="popover" id="popover-example-2-pop-top" popover data-side="top">...</div>

<button class="btn" popovertarget="popover-example-2-pop-right">Right</button>
<div class="popover" id="popover-example-2-pop-right" popover data-side="right">...</div>

<button class="btn" popovertarget="popover-example-2-pop-end">End aligned</button>
<div class="popover" id="popover-example-2-pop-end" popover data-align="end">...</div>
