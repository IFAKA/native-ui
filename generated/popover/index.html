<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>popover</title>
  <link rel="stylesheet" href="../native-ui/core.css">
  <link rel="stylesheet" href="../native-ui/layout.css">
  <link rel="stylesheet" href="../native-ui/components.css">
  <link rel="stylesheet" href="./popover.css">
</head>
<body>
  <main class="container readable stack">
  <nav><a href="../index.html">All components</a></nav>
  <header class="stack"><h1>popover</h1></header>
<section><h2>Example 1</h2><button class="btn" data-variant="outline" popovertarget="popover-example-1-my-popover">Open Popover</button>

<div class="popover" id="popover-example-1-my-popover" popover>
  <div class="popover-header">
    <p class="popover-title">Dimensions</p>
    <p class="popover-description">Set the dimensions for the layer.</p>
  </div>
  <div class="popover-content">
    <!-- any content -->
  </div>
</div>
</section>
<section><h2>Example 2</h2><button class="btn" popovertarget="popover-example-2-pop-top">Top</button>
<div class="popover" id="popover-example-2-pop-top" popover data-side="top">...</div>

<button class="btn" popovertarget="popover-example-2-pop-right">Right</button>
<div class="popover" id="popover-example-2-pop-right" popover data-side="right">...</div>

<button class="btn" popovertarget="popover-example-2-pop-end">End aligned</button>
<div class="popover" id="popover-example-2-pop-end" popover data-align="end">...</div>
</section>
  </main>
</body>
</html>
