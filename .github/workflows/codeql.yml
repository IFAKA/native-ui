name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: github/codeql-action/init@e306b2f7b7d9c1f6b7f2f2f1c2c7a6f7f2c3d4e5
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@e306b2f7b7d9c1f6b7f2f2f1c2c7a6f7f2c3d4e5
