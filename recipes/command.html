<button type="button" data-dialog-open="#command-dialog">Open command palette</button>
<dialog id="command-dialog">
  <section data-command class="stack">
    <label>Command <input type="search" autocomplete="off"></label>
    <div role="listbox">
      <button type="button" data-command-item>Open file</button>
      <button type="button" data-command-item>Search</button>
      <button type="button" data-command-item>Settings</button>
    </div>
    <button type="button" data-dialog-close>Close</button>
  </section>
</dialog>
